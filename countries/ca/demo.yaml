# under extra: one list of values per field (countries/ru/demo.yaml).

# The page for car buyers (buyer-site/index.html). h1 may hold an <em>.
page:
  title: Car Buyout · Leads from your windshield cards
  description: 'A working demo: the form a seller fills in after scanning your card, and the app where the lead arrives with a push.'
  badge: Demo
  kicker_hero: For cash-for-cars buyers
  h1: Every card under a wiper <em>can bring you a seller.</em>
  lead: Many people who would never call a stranger will scan a code. They answer a few questions on their phone in a few minutes, and you get a push with the car, the price and photos, ready for the first call.
  try_button: Try it yourself ↓
  card_front_alt: 'A sample card, front: We buy any car, with a QR code'
  card_back_alt: 'A sample card, back: what is bought, the QR code again and the phone number'
  card_caption: A sample card. Yours carries your name, phone and colour.
  kicker_demo: Live demo
  h2_demo: Be the seller. Then be the buyer.
  sub_demo: On the first phone, answer as someone who found your card would. The moment the contact details are in, the lead lands on the second phone with a push. Tap it, change the status, add a note.
  seller_frame_title: The seller's form, a working demo
  seller_title: The seller
  seller_caption: Found your card, scanned it. No app, no account.
  buyer_frame_title: Your app, a working demo
  buyer_title: You
  buyer_caption: A push within seconds, then one tap to call.
  demo_note: A working demo with made-up leads and AI-generated car photos. Nothing you type leaves this page.
  start_over: Start over
  kicker_get: What you get
  h2_get: Everything between the card and the call.
  p1_title: Cards with your QR code
  p1_text: A print-ready file in your colours for any print shop. Each placement can get its own code, so you see which cards and spots bring cars.
  p2_title: A form sellers finish
  p2_text: One question per screen, no app, no account, photos straight from the phone. A form left halfway waits for them for a week.
  p3_title: A push in seconds
  p3_text: The car, the price and the photos on your phone. The seller's name and number never show on the lock screen.
  p4_title: Every lead in one app
  p4_text: New, in progress, purchased, rejected. Notes, one tap to call or message, and statistics on what brings cars.
  kicker_yours: Yours
  h2_yours: Your name, your colours, your address.
  sub_yours: The form, the app and the cards carry your business's name, colour and logo, at your own web address. It runs on your own account, and the leads belong to you. Sellers' personal details are deleted automatically 90 days after a deal is closed.
  footer: Questions? Ask the person who sent you this link.
  toast: New lead on your phone ↓
