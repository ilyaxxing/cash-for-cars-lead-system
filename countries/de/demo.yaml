page:
  title: Autoankauf Sofort · Anfragen über Ihre Visitenkarten
  description: 'Eine funktionierende Demo: das Formular, das ein Verkäufer nach dem Scannen Ihrer Karte ausfüllt, und die App, in der die Anfrage per Push ankommt.'
  badge: Demo
  kicker_hero: Für Autoankäufer
  h1: Jede Karte unterm Scheibenwischer <em>kann Ihnen einen Verkäufer bringen.</em>
  lead: Viele, die nie einen Fremden anrufen würden, scannen gern einen Code. Sie beantworten in wenigen Minuten ein paar Fragen auf dem Handy, und Sie bekommen eine Push-Meldung mit Auto, Preis und Fotos, bereit für den ersten Anruf.
  try_button: Selbst ausprobieren ↓
  card_front_alt: 'Eine Beispielkarte, Vorderseite: Wir kaufen Ihr Auto, mit QR-Code'
  card_back_alt: 'Eine Beispielkarte, Rückseite: was wir kaufen, noch einmal der QR-Code und die Telefonnummer'
  card_caption: Eine Beispielkarte. Ihre trägt Ihren Namen, Ihre Nummer und Ihre Farbe.
  kicker_demo: Live-Demo
  h2_demo: Seien Sie der Verkäufer. Dann der Käufer.
  sub_demo: Antworten Sie auf dem ersten Handy so, wie jemand, der Ihre Karte gefunden hat. Sobald die Kontaktdaten drin sind, landet die Anfrage per Push auf dem zweiten Handy. Tippen Sie darauf, ändern Sie den Status, fügen Sie eine Notiz hinzu.
  seller_frame_title: Das Formular des Verkäufers, eine funktionierende Demo
  seller_title: Der Verkäufer
  seller_caption: Hat Ihre Karte gefunden und gescannt. Ohne App, ohne Konto.
  buyer_frame_title: Ihre App, eine funktionierende Demo
  buyer_title: Sie
  buyer_caption: Eine Push-Meldung in Sekunden, dann ein Tipp zum Anrufen.
  demo_note: Eine funktionierende Demo mit erfundenen Anfragen und KI-generierten Autofotos. Nichts, was Sie eingeben, verlässt diese Seite.
  start_over: Neu starten
  kicker_get: Was Sie bekommen
  h2_get: Alles zwischen der Karte und dem Anruf.
  p1_title: Karten mit Ihrem QR-Code
  p1_text: Eine druckfertige Datei in Ihren Farben für jede Druckerei. Jeder Standort kann einen eigenen Code bekommen, so sehen Sie, welche Karten und Gegenden Autos bringen.
  p2_title: Ein Formular, das Verkäufer zu Ende bringen
  p2_text: Eine Frage pro Bildschirm, ohne App und Konto, Fotos direkt vom Handy. Ein halb ausgefülltes Formular wartet eine Woche auf sie.
  p3_title: Eine Push-Meldung in Sekunden
  p3_text: Auto, Preis und Fotos auf Ihrem Handy. Name und Nummer des Verkäufers erscheinen nie auf dem Sperrbildschirm.
  p4_title: Alle Anfragen in einer App
  p4_text: Neu, in Bearbeitung, gekauft, abgelehnt. Notizen, ein Tipp zum Anrufen oder Schreiben und eine Statistik, was Ihnen Autos bringt.
  kicker_yours: Ihres
  h2_yours: Ihr Name, Ihre Farben, Ihre Adresse.
  sub_yours: Formular, App und Karten tragen Namen, Farbe und Logo Ihres Unternehmens, unter Ihrer eigenen Webadresse. Alles läuft in Ihrem eigenen Konto, und die Anfragen gehören Ihnen. Personenbezogene Daten der Verkäufer werden 90 Tage nach Abschluss automatisch gelöscht.
