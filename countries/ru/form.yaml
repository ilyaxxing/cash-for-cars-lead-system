# Seller questionnaire for a car buyer in Russia (countries/ru: a starting point for a client's own PRESET_FILE).
#
# Structure only: every label, hint and error message lives in
# locales/<locale>.json under keys derived from the ids below.
# See "Customize the form" in the README before editing.
#
# Fields whose id matches a lead column (make, model, year, mileage,
# asking_price, location, phone, name) are stored in that column; all other
# answers go to the lead's JSONB `answers`, so new fields need no migration.

id: ru-car-buyout
version: 1
distance_unit: km
phone_region: RU
postal_code_pattern: '\d{6}'

steps:
  - id: vehicle
    fields:
      - id: make
        type: text
        required: true
        chip: true
        max_length: 64
        widget: tiles
        other: true
        suggestions: [Lada, Toyota, Kia, Hyundai, Volkswagen, Škoda, Renault, Chery, Haval, Geely]
      - id: model
        type: text
        required: true
        chip: true
        max_length: 64
        widget: chips
        suggestions_by: make
        suggestions:
          Lada: [Granta, Vesta, Niva Legend, Largus, XRAY]
          Toyota: [Camry, Corolla, RAV4, Land Cruiser Prado, Land Cruiser]
          Kia: [Rio, Sportage, Ceed, Optima, Sorento]
          Hyundai: [Solaris, Creta, Tucson, Elantra, Santa Fe]
          Volkswagen: [Polo, Tiguan, Passat, Jetta, Touareg]
          Škoda: [Octavia, Rapid, Kodiaq, Superb, Karoq]
          Renault: [Logan, Sandero, Duster, Kaptur, Arkana]
          Chery: [Tiggo 4, Tiggo 7 Pro, Tiggo 8 Pro, Arrizo 8]
          Haval: [Jolion, F7, H6, Dargo, M6]
          Geely: [Coolray, Monjaro, Atlas, Tugella, Emgrand]

  - id: year_mileage
    group: vehicle
    show_chips: true
    fields:
      - id: year
        type: number
        required: true
        chip: true
        widget: year_grid
        recent: 12
        min: 1990
        # Anything older is a single "Earlier" answer: the exact year matters
        # less than knowing the car is a classic or a parts car.
        earlier: 1990
      - id: mileage
        type: number
        required: true
        chip: true
        unit: distance
        min: 0
        max: 950000

  - id: condition
    group: vehicle
    show_chips: true
    fields:
      - id: condition
        type: select
        required: true
        chip: true
        options:
          - { id: excellent, level: 4 }
          - { id: good, level: 3 }
          - { id: needs_repairs, level: 2 }
          - { id: accident_damaged, level: 1 }
          - { id: not_running, level: 0 }

  - id: accident
    group: history
    show_chips: true
    fields:
      - id: accident
        type: yes_no
        required: true
        unknown: true
        flag: "yes"
        follow_up:
          when: "yes"
          fields:
            - { id: accident_details, type: text, multiline: true, max_length: 400 }

  - id: finance
    group: history
    show_chips: true
    fields:
      - id: finance
        type: yes_no
        required: true
        unknown: true
        flag: "yes"
        follow_up:
          when: "yes"
          fields:
            - { id: finance_details, type: text, multiline: true, max_length: 400 }

  # Not every seller has the title at hand or remembers the owners: either
  # answer, both or neither.
  - id: documents
    group: history
    show_chips: true
    skippable: true
    fields:
      - id: pts
        type: select
        chip: true
        options:
          - { id: original }
          - { id: duplicate }
          - { id: electronic }
      - { id: owners, type: number, chip: true, min: 1, max: 20 }

  - id: price
    skippable: true
    note: box
    fields:
      - { id: asking_price, type: number, unit: currency, min: 1000, max: 50000000 }

  - id: location
    skippable: true
    note: icon
    fields:
      - { id: location, type: text, required: true, max_length: 128 }
      # Many sellers here don't know their postal code by heart; the city is enough.
      - { id: postal_code, type: text, format: postal_code }

  - id: vin
    skippable: true
    note: text
    fields:
      - { id: vin, type: text, format: vin }

  - id: contact
    submit: true
    consent: true
    fields:
      - { id: name, type: text, required: true, personal: true, max_length: 128 }
      - { id: phone, type: phone, required: true, personal: true }
      - id: email
        type: text
        format: email
        personal: true
        max_length: 254
        required_when: { contact_method: email }
      - id: contact_method
        type: select
        default: call
        options:
          - { id: call }
          - { id: telegram }
          - { id: whatsapp }
          - { id: sms }
          - { id: email }

  - id: photos
    fields:
      - id: photos
        type: photos
        extra: 4
        slots:
          - { id: front_left, image: guide-front-left.webp, ratio: "2336 / 1760" }
          - { id: rear_right, image: guide-rear-right.webp, ratio: "2336 / 1760" }
          - { id: front_right, image: guide-front-right.webp, ratio: "2336 / 1760" }
          - { id: rear_left, image: guide-rear-left.webp, ratio: "2336 / 1760" }
          - { id: interior, image: guide-interior.webp, ratio: "1 / 1" }
          - { id: cluster, image: guide-cluster.webp, ratio: "1 / 1" }
