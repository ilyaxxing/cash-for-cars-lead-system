page:
  title: Выкуп авто · Заявки с ваших визиток
  description: 'Рабочее демо: анкета, которую продавец заполняет после скана кода или перехода по ссылке, и приложение, куда заявка приходит пушем.'
  badge: Демо
  kicker_hero: Для автовыкупа
  h1: Каждая визитка под дворником <em>может привести продавца.</em>
  lead: Многие, кто ни за что не позвонит незнакомцу, отсканируют код. Они за несколько минут ответят на вопросы с телефона, а вам придёт пуш с машиной, ценой и фото, всё готово к первому звонку.
  try_button: Попробовать ↓
  card_front_alt: 'Образец визитки, лицевая сторона: выкупим любое авто, с QR-кодом'
  card_back_alt: 'Образец визитки, обратная сторона: что выкупаем, снова QR-код и телефон'
  card_caption: Образец визитки. На вашей будут ваше название, телефон и цвет.
  kicker_demo: Живое демо
  h2_demo: Побудьте продавцом. Потом покупателем.
  sub_demo: На первом телефоне ответьте так, как ответил бы человек, нашедший вашу визитку. Как только он оставит контакты, заявка придёт на второй телефон пушем. Нажмите на него, смените статус, добавьте заметку.
  seller_frame_title: Анкета продавца, рабочее демо
  seller_title: Продавец
  seller_caption: Нашёл визитку, отсканировал. Без приложений и регистрации.
  buyer_frame_title: Ваше приложение, рабочее демо
  buyer_title: Вы
  buyer_caption: Пуш через секунды, звонок в одно касание.
  demo_note: Рабочее демо с выдуманными заявками и фото машин, созданными ИИ. Ничего из введённого не покидает эту страницу.
  start_over: Начать заново
  kicker_get: Что вы получаете
  h2_get: Всё между визиткой и звонком.
  p1_title: Визитки с вашим QR-кодом
  p1_text: Готовый к печати файл в ваших цветах для любой типографии. У каждого места может быть свой код, и видно, какие места приводят машины.
  p2_title: Анкета, которую заполняют до конца
  p2_text: Один вопрос на экран, без приложений и регистрации, фото прямо с телефона. Брошенная анкета ждёт продавца неделю.
  p3_title: Пуш за секунды
  p3_text: Машина, цена и фото у вас в телефоне. Имя и номер продавца на экране блокировки не показываются.
  p4_title: Все заявки в одном приложении
  p4_text: Новые, в работе, выкуплены, отказ. Заметки, звонок или сообщение в одно касание и статистика того, что приводит машины.
  kicker_yours: Всё ваше
  h2_yours: Ваше название, ваши цвета, ваш адрес.
  sub_yours: Анкета, приложение и визитки несут название, цвет и логотип вашей компании, на вашем собственном адресе. Всё работает на вашем аккаунте, и заявки принадлежат вам. Личные данные продавцов удаляются автоматически через 90 дней после закрытия сделки.
  footer: Вопросы? Спросите того, кто прислал вам эту ссылку.
  toast: Новая заявка на телефоне ↓
