  kicker_hero: Для автовыкупа
  h1: Больше заявок — <em>больше машин на выкуп.</em>
  lead: Продавец сканирует QR-код на визитке или наклейке и за пару минут заполняет анкету. Вам сразу приходит заявка с машиной, а следом фото, если продавец их добавил. Видно, стоит ли звонить.
