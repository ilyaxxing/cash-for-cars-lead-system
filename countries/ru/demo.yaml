  kicker_places: Где ставить код
  h2_places: Сразу видно, откуда идут продавцы.
  place_card: Визитка под дворником
  place_sticker: Наклейка на вашей машине
  place_partner: Плакат на СТО или у эвакуаторщика
  place_sign: Щит или баннер
  place_maps: Ссылка в карточке на Яндекс Картах
  place_social: Ссылка в соцсетях и местных группах
  places_note: У каждого места свой код или ссылка, так что в приложении видно, откуда реально идут машины.
  kicker_demo: "Попробуйте сами"
  h2_demo: Заполните анкету за продавца и посмотрите, как придёт заявка.
  sub_demo: На первом экране анкета, как её видит продавец. Ответьте за него. Дойдёте до имени и телефона, сохраните их, и заявка придёт на второй экран, в ваше приложение, вместе с уведомлением. Откройте её, смените статус, добавьте заметку.
  seller_frame_title: Анкета продавца, рабочее демо
  seller_title: Продавец
  seller_caption: Отсканировал код. Ничего не скачивает и нигде не регистрируется.
  buyer_frame_title: Ваше приложение, рабочее демо
  buyer_title: "Ваше приложение"
  buyer_caption: Заявка приходит за несколько секунд, звонок в одно нажатие.
  demo_note: Заявки здесь выдуманные, фото машин сделал ИИ. Всё, что вы введёте, никуда не уходит из вашего браузера.
  start_over: Начать заново
  kicker_get: Что вы получаете
  h2_get: От QR-кода до звонка продавцу.
  p1_title: Ваши QR-коды и ссылки
  p1_text: "Макет визитки в ваших цветах: отдаёте в любую типографию и печатаете. На каждое другое место свой код или ссылка, так что видно, откуда идут машины."
  p2_title: Анкету легко заполнить с телефона
  p2_text: "Три коротких шага о машине, потом телефон, и заявка уже у вас. История, цена и фото идут после, по желанию. Ничего не надо скачивать и регистрироваться."
  p3_title: Заявка за несколько секунд
  p3_text: В уведомлении машина, а ещё цена и сколько фото, если продавец их добавил. Имя и телефон продавца на заблокированном экране не видно.
  p4_title: Все заявки в одном приложении
  p4_text: Статусы «Новая», «В работе», «Выкуплена», «Отказ». Заметки, звонок или сообщение продавцу в одно нажатие и статистика, откуда сколько заявок.
  kicker_yours: Всё ваше
  h2_yours: Ваше название, ваши цвета, ваш адрес.
  sub_yours: В анкете, в приложении и на визитках — ваше название, цвет и логотип, адрес сайта тоже ваш. Всё стоит на вашем сервере, заявки ваши. Имя, телефон, почта и фото продавца сами удаляются через 90 дней после закрытия заявки.
  footer: Есть вопросы? Спросите того, кто прислал вам эту ссылку.
  toast: "Пришла новая заявка ↓"
