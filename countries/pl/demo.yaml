  p2_title: Formularz, który sprzedający kończą
  p2_text: Jedno pytanie na ekran, bez aplikacji i konta, zdjęcia prosto z telefonu. Przerwany w połowie formularz czeka na nich tydzień.
  p3_title: Powiadomienie w kilka sekund
  p3_text: Auto, cena i zdjęcia na Twoim telefonie. Imię i numer sprzedającego nigdy nie pojawiają się na ekranie blokady.
