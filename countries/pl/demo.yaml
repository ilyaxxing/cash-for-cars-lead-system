  title: Skup Aut Ekspres · Zgłoszenia z Twoich wizytówek
  description: 'Działające demo: formularz, który sprzedający wypełnia po zeskanowaniu Twojego kodu lub kliknięciu Twojego linku, i aplikacja, w której zgłoszenie przychodzi jako powiadomienie.'
