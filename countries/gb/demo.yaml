# The demo for this country (tools/make_demo.py, tools/make_buyer_site.py):
# a fictional business, its leads and the page sent to a car buyer. Nothing
# here goes into a client's instance. Phone numbers are in Ofcom's range kept
# for drama (07700 900xxx), and number plates start with ZZ, which the DVLA
# never issues.

# In the link maker on the project page: the country in English, the language in its own words.
label: United Kingdom · English
lang: en

# The made-up business the demo pages name, and the contact on its sample card.
business:
  brand_name: Car Buyout
  brand_phone: 07700 900100
  operator_name: Example Motors Ltd
  operator_email: privacy@example.com
  operator_address: 1 Example Street, Manchester M1 1AE
  policy_effective_date: 1 October 2026
  public_url: https://buy.example.com
  card_contact: Dave

# Shown instead of dialing when a visitor taps Call or a messenger in the demo.
calls_off: In the demo, calls and messages are turned off.
# Shown at the top of the demo's privacy policy.
policy_note: A sample policy for a made-up business. For a real one it is written for its country's law and checked by its lawyer.
# Prices below are in US dollars; this converts them, rounded to price_step.
price_scale: 0.8
price_step: 100

# The six leads with photos, newest first, in the order of frontend/src/demo/seed.ts:
# what each seller wrote, any of this country's own questions too, and a note.
featured:
  - {make: Kia, model: Optima, location: Manchester, postal_code: 'M14 5RL', name: James Wilson, registration: ZZ17 KOP}
  - {make: Hyundai, model: Kona, location: Salford, postal_code: 'M5 4WT', name: Emily Clarke, email: emily@example.com, finance_details: About £4,500 left on the PCP.}
  - {make: Ford, model: Fiesta, location: Stockport, postal_code: 'SK1 3XE', name: Oliver Hughes, accident_details: Front-end shunt last spring. It still drives.}
  - {make: Ford, model: Ranger, location: Oldham, postal_code: 'OL1 1HL', name: Sophie Turner, registration: ZZ66 RNG, note: 'Called the seller, viewing booked for Thursday.'}
  - {make: Vauxhall, model: Zafira, location: Manchester, postal_code: 'M20 2RN', name: Harry Evans, email: harry@example.com, note: 'Offered £1,200 under asking; seller is thinking it over.'}
  - {make: Hyundai, model: Genesis, location: Bolton, postal_code: 'BL1 1RU', name: Charlotte Hall, note: 'Collected on a trailer on Saturday, paid by bank transfer.'}
phones: ['+447700900142', '+447700900117', '+447700900163', '+447700900128', '+447700900189', '+447700900104', '+447700900131', '+447700900175']

